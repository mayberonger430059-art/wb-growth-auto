name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  syntax-and-smoke:
    name: Syntax check (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Syntax check all scripts
        run: |
          for f in scripts/*.cjs scripts/lib/*.cjs; do
            echo "check: $f"
            node --check "$f"
          done

      - name: Rule unit tests (no client required)
        run: node scripts/self-test.cjs

      - name: CLI help exits cleanly (no client required)
        run: |
          node scripts/wb-call.cjs --help
          node scripts/wb-growth.cjs --help
          node scripts/wb-tasks.cjs --help
          node scripts/wb-harvest.cjs --help
          node scripts/wb-doctor.cjs --help

      - name: No credentials committed
        run: |
          # 运行时端点文件包含 ticket，绝不允许出现在仓库里
          ! grep -rn "endpoint.json" --include="*.json" scripts/ docs/ examples/
          ! find . -path ./.git -prune -o -name "endpoint.json" -print | grep -q .
